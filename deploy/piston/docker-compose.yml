# Piston — self-hosted code execution engine (Solvary M2 sandbox).
#
#   docker compose up -d
#   docker exec piston_api cli/index.js ppman install python
#   docker exec piston_api cli/index.js ppman install node
#
# API on http://localhost:2000. Requires a cgroup-v2 host (Docker Desktop default).
# Language packages persist in the named volume across restarts.

services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    environment:
      # Piston rejects per-request timeouts above these caps (default 3000ms);
      # problems may set time_limit_s up to 15s
      PISTON_RUN_TIMEOUT: 15000
      PISTON_COMPILE_TIMEOUT: 15000
      PISTON_RUN_CPU_TIME: 15000
      # Piston kills a run whose stdout exceeds this many BYTES (default 1024!) —
      # a pytest-mode suite reports every test in one run, so give it 1 MiB
      PISTON_OUTPUT_MAX_SIZE: 1048576
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  piston_packages:
