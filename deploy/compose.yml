# Solvary — full production stack.
#
#   cp .env.example .env        # set SECRET_KEY + POSTGRES_PASSWORD
#   docker compose up -d --build
#   ./piston/install-runtimes.sh              # one-time: language runtimes
#   docker compose exec backend python -m scripts.seed_admin
#   docker compose exec backend python -m scripts.seed_problems
#
# App on http://localhost:8080. Put TLS in front (Caddy/Traefik/ALB) for
# real deployments — the refresh cookie is Secure in production and
# requires HTTPS end-to-end.
#
# Scaling: with the Redis queue + backplane, the backend scales out:
#   docker compose up -d --scale backend=3
# (nginx re-resolves the backend service per request — see nginx.conf)

name: solvary

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: solvary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: solvary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvary"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: 15000
      PISTON_COMPILE_TIMEOUT: 15000
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  backend:
    build: ../solvary_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql+asyncpg://solvary:${POSTGRES_PASSWORD}@db:5432/solvary
      EXECUTION_PROVIDER: piston
      PISTON_BASE_URL: http://piston:2000
      QUEUE_BACKEND: redis
      REALTIME_BACKPLANE: redis
      REDIS_URL: redis://redis:6379/0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      piston:
        condition: service_started

  frontend:
    build:
      context: ../solvary_react
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  piston_packages:
