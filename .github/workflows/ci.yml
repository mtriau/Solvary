name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvary_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: solvary_backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app scripts tests
      - run: python -m pytest -q

  backend-postgres:
    name: Backend (tests + migrations, Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvary_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solvary
          POSTGRES_PASSWORD: solvary
          POSTGRES_DB: solvary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://solvary:solvary@localhost:5432/solvary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: solvary_backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Full migration chain must apply cleanly to an empty Postgres
      - name: Verify migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://solvary:solvary@localhost:5432/solvary_test
      # Tests drop + recreate the schema themselves (conftest)
      - run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvary_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solvary_react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build solvary_backend
      - name: Build frontend image
        run: docker build solvary_react
